site_name: Flutter Zero 文档
site_description: Flutter Zero 企业级 MVI 模板 —— 架构、快速上手、Effect 与 Notifiers 系统设计
site_url: https://dboy233.github.io/flutter_zero_doc/
# repo_url: https://github.com/<your-org>/flutter_zero_doc   # 待你补充
# edit_uri: edit/main/docs

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: zh
          name: 中文
          build: true
          default: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            快速上手: Getting Started
            安装与创建项目: Install & Create Project
            编写第一个功能模块: Write Your First Feature
            架构设计: Architecture
            总览与分层: Overview & Layering
            BLoC 四个 Mixin: The Four BLoC Mixins
            Effect 与 Notifiers: Effect & Notifiers
            错误处理与 Result: Error Handling & Result
            依赖注入: Dependency Injection
            CLI 参考: CLI Reference
            发布与版本: Release & Versions
            发布流程: Release Process
            CLI 版本管理: CLI Versioning
            模板版本管理: Template Versioning
            版本约束规则: Version Constraint Rules

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mermaid-zoom.js

nav:
  - 首页: index.md
  - 快速上手:
      - 安装与创建项目: getting-started/index.md
      - 编写第一个功能模块: getting-started/your-first-feature.md
  - 架构设计:
      - 总览与分层: architecture/index.md
      - BLoC 四个 Mixin: architecture/bloc-mixins.md
      - Effect 与 Notifiers: effect-system/index.md
      - 错误处理与 Result: architecture/error-handling.md
      - 依赖注入: architecture/dependency-injection.md
  - CLI 参考: cli/README.md
  - 发布与版本:
      - 发布流程: release.md
      - CLI 版本管理: versioning-cli.md
      - 模板版本管理: versioning-template.md
      - 版本约束规则: versioning-rules.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
