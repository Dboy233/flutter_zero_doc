site_name: Flutter Zero 文档
site_description: Flutter Zero 企业级 MVI 模板 —— 架构、快速上手、Effect 与 Notifiers 系统设计
# repo_url: https://github.com/<your-org>/flutter_zero_doc   # 待你补充
# edit_uri: edit/main/docs

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mermaid-zoom.js

nav:
  - 首页: index.md
  - 快速上手:
      - 安装与创建项目: getting-started/index.md
      - 编写第一个功能模块: getting-started/your-first-feature.md
  - 架构设计:
      - 总览与分层: architecture/index.md
      - BLoC 四个 Mixin: architecture/bloc-mixins.md
      - Effect 与 Notifiers: effect-system/index.md
      - 错误处理与 Result: architecture/error-handling.md
      - 依赖注入: architecture/dependency-injection.md
  - CLI 参考: cli/README.md
  - 发布与版本:
      - 发布流程: release.md
      - CLI 版本管理: versioning-cli.md
      - 模板版本管理: versioning-template.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
